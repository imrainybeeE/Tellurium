# Minecraft 26.1.2, kernels that do all arithmetic in integers (profile GPU_IEEE_BITS), for a GPU without 64-bit
# floats such as Apple's.  No fingerprint is listed, on purpose.  The matrix run was made on an Apple M3 (MacBook Air,
# 2026-10-20, docs/evidence/minecraft-26.1.2.md): SURFACE, Overworld, Nether and End, 8,281 chunks each, digests
# identical to vanilla.  But the path was slower than the CPU there, so gpu.mode = "auto" keeps every dimension on the
# CPU and says why (auto.reason below, shown in the log and /tellurium status).  "check" compares the GPU with vanilla
# chunk by chunk; "force" uses the GPU.  It is separate from fused-qualified.properties because the two kinds of kernel
# have different text and so different fingerprints; a list holds for its own profile only.
minecraft=26.1.2
profile=GPU_IEEE_BITS
auto.reason=on Apple GPUs auto mode keeps terrain on the CPU: on an Apple M3 (MacBook Air) the GPU path, exact but with 64-bit arithmetic emulated in integers, generated 129 chunks/s against 179 for the CPU (full chunks, 16,129 with Chunky). A larger Apple GPU may do better; gpu.mode = "force" in config/tellurium.toml uses it.
