# Minecraft 26.1.2, kernels that do all arithmetic in integers (profile GPU_IEEE_BITS), for a GPU without 64-bit
# floats such as Apple's.  No fingerprint is listed yet: this list comes from the 26.1.2 matrix run on such a GPU
# (scripts/verify-fast-matrix.sh, docs/CONTRACTS.md), and that run has not been made.  Until it has, gpu.mode =
# "auto" generates every dimension with vanilla code on such a GPU; "check" compares the GPU with vanilla chunk by
# chunk, "force" uses the GPU untested.  It is separate from fused-qualified.properties because the two kinds of
# kernel have different text and so different fingerprints; a list holds for its own profile only.
minecraft=26.1.2
profile=GPU_IEEE_BITS
