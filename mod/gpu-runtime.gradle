// Applied by each loader's module: nests the Vulkan runtime (and, for macos targets, the Metal one) and LWJGL in the mod jar.
// ---- Bundled GPU runtime -------------------------------------------------
// The Vulkan runtime and its LWJGL bindings/natives are nested as plain jars
// (not jar-in-jar modules) and loaded by GpuRuntimeLoader in an isolated class
// loader, so they cannot clash with a client's own LWJGL and are present on a
// dedicated server that has none.
//
// The LWJGL version is the game's own where a target names one (lwjgl in mod/targets.gradle).  The isolated
// loader is child-first for classes only: LWJGL looks its native libraries up as resources, parent first, so
// on a client the game's copy of a library can be the one found, and it has to match the bundled Java side.
// A target with macos: true also carries the macOS arm64 natives (lwjgl-vulkan's holds MoltenVK, the Vulkan
// implementation there), SPIRV-Cross and the runtime-metal jar; on Windows and Linux the system's Vulkan loader is used.
def gpuTarget = gradle.ext.modTargets[project.name]
def lwjgl = gpuTarget.lwjgl ?: '3.3.3'
configurations { gpuRuntime { transitive = false } }
dependencies {
    gpuRuntime "org.lwjgl:lwjgl:$lwjgl"
    gpuRuntime "org.lwjgl:lwjgl-vulkan:$lwjgl"
    gpuRuntime "org.lwjgl:lwjgl-shaderc:$lwjgl"
    gpuRuntime "org.lwjgl:lwjgl:$lwjgl:natives-windows"
    gpuRuntime "org.lwjgl:lwjgl-shaderc:$lwjgl:natives-windows"
    gpuRuntime "org.lwjgl:lwjgl:$lwjgl:natives-linux"
    gpuRuntime "org.lwjgl:lwjgl-shaderc:$lwjgl:natives-linux"
    if (gpuTarget.macos) {
        gpuRuntime "org.lwjgl:lwjgl:$lwjgl:natives-macos-arm64"
        gpuRuntime "org.lwjgl:lwjgl-shaderc:$lwjgl:natives-macos-arm64"
        gpuRuntime "org.lwjgl:lwjgl-vulkan:$lwjgl:natives-macos-arm64"
        // SPIRV-Cross, for the emulated kernels as Metal source (runtime-vulkan's MetalKernelSource).
        gpuRuntime "org.lwjgl:lwjgl-spvc:$lwjgl"
        gpuRuntime "org.lwjgl:lwjgl-spvc:$lwjgl:natives-macos-arm64"
    }
}
def gpuRuntimeDir = layout.buildDirectory.dir('generated/gpuRuntime')
tasks.register('stageGpuRuntime', Sync) {
    def runtimeJar = project(':runtime-vulkan').tasks.named('jar')
    dependsOn runtimeJar
    from(configurations.gpuRuntime)
    from(runtimeJar)
    // A target with macos: true also carries the native Metal backend (runtime-metal, built for Java 25 like the game it
    // is bundled with); FusedNoiseDevice.openIsolated runs it on macOS instead of MoltenVK.
    if (gpuTarget.macos) {
        def metalJar = project(':runtime-metal').tasks.named('jar')
        dependsOn metalJar
        from(metalJar)
    }
    into gpuRuntimeDir.map { it.dir('META-INF/tellurium-gpu') }
    doLast {
        def directory = gpuRuntimeDir.get().dir('META-INF/tellurium-gpu').asFile
        def names = directory.listFiles().findAll { it.name.endsWith('.jar') }.collect { it.name }.sort()
        new File(directory, 'index.txt').text = names.join('\n') + '\n'
    }
}
sourceSets.main.resources.srcDir(gpuRuntimeDir)
tasks.named('processResources') { dependsOn 'stageGpuRuntime' }
tasks.matching { it.name == 'sourcesJar' }.configureEach { dependsOn 'stageGpuRuntime'; exclude 'META-INF/tellurium-gpu/**' }
