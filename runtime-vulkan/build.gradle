dependencies {
    api platform('org.lwjgl:lwjgl-bom:3.3.3')
    implementation 'org.lwjgl:lwjgl'
    implementation 'org.lwjgl:lwjgl-vulkan'
    implementation 'org.lwjgl:lwjgl-shaderc'
    // SPIRV-Cross: the emulated kernels go to MoltenVK as Metal source (MetalKernelSource).
    implementation 'org.lwjgl:lwjgl-spvc'
    runtimeOnly 'org.lwjgl:lwjgl::natives-windows'
    runtimeOnly 'org.lwjgl:lwjgl-shaderc::natives-windows'
    runtimeOnly 'org.lwjgl:lwjgl::natives-linux'
    runtimeOnly 'org.lwjgl:lwjgl-shaderc::natives-linux'
    runtimeOnly 'org.lwjgl:lwjgl::natives-macos-arm64'
    runtimeOnly 'org.lwjgl:lwjgl-shaderc::natives-macos-arm64'
    // Carries libMoltenVK.dylib, the Vulkan implementation on macOS.
    runtimeOnly 'org.lwjgl:lwjgl-vulkan::natives-macos-arm64'
    runtimeOnly 'org.lwjgl:lwjgl-spvc::natives-macos-arm64'
    testRuntimeOnly 'org.lwjgl:lwjgl-spvc::natives-windows'
    testRuntimeOnly 'org.lwjgl:lwjgl-spvc::natives-linux'
}

// The tests run on the LWJGL the 26.1.2 build bundles (mod/targets.gradle): the Metal-source conversion has to
// match that MoltenVK's own SPIRV-Cross, and an older SPIRV-Cross changes what signed modulo means.
configurations.named('testRuntimeClasspath') {
    resolutionStrategy.eachDependency { if (it.requested.group == 'org.lwjgl') it.useVersion '3.4.1' }
}

tasks.register('nativeDeviceProbe', JavaExec) {
    group = 'verification'
    description = 'Opt-in G0 probe: lists Vulkan devices with the properties, limits and extensions the integer profile needs.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    jvmArgs '-Dorg.lwjgl.system.stackSize=2048'
    mainClass = 'dev.tellurium.runtime.vulkan.NativeDeviceProbe'
    args "--output=${layout.buildDirectory.file('reports/native-device-probe.json').get().asFile.absolutePath}"
}

tasks.register('nativeIntegerIeeeCompile', JavaExec) {
    group = 'verification'
    description = 'Opt-in shaderc compilation of emitted FP32 and FP64 integer-carrier worldgen shaders.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    jvmArgs '-Dorg.lwjgl.system.stackSize=2048'
    mainClass = 'dev.tellurium.runtime.vulkan.NativeIntegerIeeeCompile'
}

tasks.register('nativeIntegerIeee', JavaExec) {
    group = 'verification'
    description = 'Opt-in real-device integer-carrier arithmetic conformance (-Ptellurium.ieeeFused=true: the fused-kernel helpers instead; -Ptellurium.ieeeFusedLib=true: the fused library functions instead); fails when no suitable Vulkan device exists.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    jvmArgs '-Dorg.lwjgl.system.stackSize=2048'
    mainClass = 'dev.tellurium.runtime.vulkan.NativeIntegerIeeeRunner'
    def fusedIeee = providers.gradleProperty('tellurium.ieeeFused').map { it == 'true' }.orElse(false).get()
    def fusedLib = providers.gradleProperty('tellurium.ieeeFusedLib').map { it == 'true' }.orElse(false).get()
    def reportName = fusedLib ? 'reports/native-integer-ieee-fused-lib.json' : (fusedIeee ? 'reports/native-integer-ieee-fused.json' : 'reports/native-integer-ieee.json')
    args "--output=${layout.buildDirectory.file(reportName).get().asFile.absolutePath}"
    if (fusedIeee) args '--fused-ieee'
    if (fusedLib) args '--fused-lib'
    if (providers.gradleProperty('tellurium.ieeeRelease').map { it == 'true' }.orElse(false).get()) args '--release'
    if (providers.gradleProperty('tellurium.ieeeArithmeticOnly').map { it == 'true' }.orElse(false).get()) args '--arithmetic-only'
    if (providers.gradleProperty('tellurium.ieeeHostNanSignAgnostic').map { it == 'true' }.orElse(false).get()) args '--host-nan-sign-agnostic'
}

tasks.register('nativeIntegerIeeeThroughput', JavaExec) {
    group = 'verification'
    description = 'Opt-in sustained-throughput microbenchmark of the integer-carrier fp64/fp32 helpers next to native int32/int64/fp32; not a conformance or Minecraft test.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    jvmArgs '-Dorg.lwjgl.system.stackSize=2048'
    mainClass = 'dev.tellurium.runtime.vulkan.NativeIntegerIeeeThroughput'
    providers.gradleProperty('tellurium.throughputDumpAsm').orNull?.with { jvmArgs "-Dtellurium.throughput.dumpAsm=${it}" }
    args "--output=${layout.buildDirectory.file('reports/native-integer-ieee-throughput.json').get().asFile.absolutePath}"
    providers.gradleProperty('tellurium.throughputRuns').orNull?.with { args "--runs=${it}" }
    providers.gradleProperty('tellurium.throughputTargetMs').orNull?.with { args "--target-ms=${it}" }
    providers.gradleProperty('tellurium.throughputOnly').orNull?.with { args "--only=${it}" }
}

