tasks.register('fusedCompileProbe', JavaExec) {
    group = 'verification'
    description = 'Developer probe: compiles one fused NOISE kernel from a dumped source and reports driver time.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.tellurium.runtime.vulkan.fused.FusedCompileProbe'
    jvmArgs '-Dorg.lwjgl.system.stackSize=16384'
    args((System.getProperty('tellurium.probe.args', '') ?: '').split(' ').findAll { !it.isEmpty() })
}

tasks.register('printProbeClasspath') {
